# docker/docker-compose.yml
# HR Agent Bot - full stack (pgvector + FastAPI backend + Next.js frontend)
#
# Usage (from repo root):
#   cp .env.example .env      # then edit with real values
#   docker compose -f docker/docker-compose.yml up -d --build
#
# Frontend: http://localhost:3000
# Backend:  http://localhost:8001/docs

services:
  # ============================================================================
  # PostgreSQL with pgvector
  # ============================================================================
  postgres:
    image: pgvector/pgvector:pg15
    container_name: hr_agent_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: hr_agent
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d hr_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hr_agent_network
    restart: unless-stopped

  # ============================================================================
  # FastAPI Backend
  # ============================================================================
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: hr_agent_backend
    env_file:
      - ../.env
    environment:
      # Internal Docker network values override anything in ../.env
      DATABASE_URL: postgresql://admin:secure_password@postgres:5432/hr_agent
      APP_HOST: 0.0.0.0
      APP_PORT: 8001
      PORT: 8001
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DEBUG: "false"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hr_agent_network
    restart: unless-stopped

  # ============================================================================
  # Next.js Frontend
  # ============================================================================
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: http://backend:8001
    container_name: hr_agent_frontend
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://backend:8001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - hr_agent_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  hr_agent_network:
    driver: bridge
